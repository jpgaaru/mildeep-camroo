    // Standalone Toast
    function showToast(message, type = 'success', title = 'Client 2026') {
      const container = document.getElementById('c26-toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl border shadow-xl flex items-center gap-3 text-xs font-semibold pointer-events-auto transition-all transform translate-y-2 opacity-0 ${
        type === 'success' ? 'bg-[#ECFDF5] text-[#065F46] border-[#A7F3D0]' : 'bg-white text-slate-800 border-slate-200'
      }`;
      toast.innerHTML = `
        <span class="w-2 h-2 rounded-full ${type === 'success' ? 'bg-emerald-500' : 'bg-cyan-500'}"></span>
        <div>
          <div class="font-bold">${title}</div>
          <div class="text-[11px] opacity-90">${message}</div>
        </div>
      `;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

      const breadcrumb = document.getElementById('c26-breadcrumb-current');
      if (headerTitle) headerTitle.textContent = TAB_TITLES[AppState.activeTab] || 'Operations';

      // Update active classes on both sidebar and top nav

    function bindBookingViewEvents() {
      const searchBtn = document.getElementById('btn-search-booking');
      const resetBtn = document.getElementById('btn-reset-booking');
      const createBtn = document.getElementById('btn-create-booking');
      const exportJsonBtn = document.getElementById('btn-export-json');
      const modalMount = document.getElementById('booking-modal-mount');

      if (searchBtn) {
        searchBtn.onclick = () => {
          AppState.bookingFilters = {
            purchaseType: document.getElementById('filter-purchase')?.value || '',
            arrivalPlant: document.getElementById('filter-plant')?.value || '',
            date: document.getElementById('filter-date')?.value || ''
          };
          renderSubTab();
          showToast('Applied booking filters', 'info');
        };
      }

      if (resetBtn) {
        resetBtn.onclick = () => {
          AppState.bookingFilters = { purchaseType: '', arrivalPlant: '', date: '' };
          renderSubTab();
          showToast('Reset booking filters', 'info');
        };
      }

      if (exportJsonBtn) {
        exportJsonBtn.onclick = () => {
          const blob = new Blob([JSON.stringify(AppState.bookings, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Bookings-Export-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Bookings exported as JSON', 'success');
        };
      }

      // Download single booking
      document.querySelectorAll('[data-download]').forEach(btn => {
        btn.onclick = () => {
          const id = Number(btn.getAttribute('data-download'));
          const item = AppState.bookings.find(b => b.id === id);
          if (item) {
            const blob = new Blob([JSON.stringify(item, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${item.bookingNumber}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`Downloaded ${item.bookingNumber}.json`, 'success');
          }
        };
      });

      // Delete single booking
      document.querySelectorAll('[data-delete]').forEach(btn => {
        btn.onclick = () => {
          const id = Number(btn.getAttribute('data-delete'));
          const item = AppState.bookings.find(b => b.id === id);
          if (item && confirm(`Remove sample booking ${item.bookingNumber}?`)) {
            AppState.bookings = AppState.bookings.filter(b => b.id !== id);
            renderSubTab();
            showToast(`Booking ${item.bookingNumber} deleted`, 'info');
          }
        };
      });

      // Create Booking Modal (CreateBookingModal.tsx)
      if (createBtn && modalMount) {
        createBtn.onclick = () => {
          const nextId = Math.max(0, ...AppState.bookings.map(b => b.id)) + 1;
          const nextNum = `PB-2026-${String(nextId * 15 + 100).padStart(3, '0')}`;
          const todayStr = new Date().toISOString().slice(0, 10);

          modalMount.innerHTML = `
            <div class="fixed inset-0 bg-black/60 z-[120] flex items-center justify-center p-4 overflow-y-auto">
              <div class="bg-white rounded-2xl max-w-4xl w-full p-6 shadow-2xl relative my-8" style="max-height: 90vh; overflow-y: auto;">
                <div class="flex justify-between items-center pb-3 border-b border-[#E2E8F0] mb-4">
                  <h2 class="text-base font-bold text-[#0F172A] uppercase">Create Booking</h2>
                  <button type="button" class="text-gray-400 hover:text-gray-600 text-lg font-bold" id="c26-modal-close-btn">✕</button>
                </div>

                <form id="form-create-booking" class="create-booking-form">
                  <section class="create-booking-section create-booking-section--general">
                    <h3>General Information</h3>
                    <div class="create-booking-grid create-booking-grid--four">
                      <div class="create-booking-field">
                        <label>Booking Station *</label>
                        <select id="modal-station" required>
                          <option value="Kakinada" selected>Kakinada</option>
                          <option value="Bhimavaram">Bhimavaram</option>
                          <option value="Nellore">Nellore</option>
                        </select>
                      </div>

                      <div class="create-booking-field">
                        <label>Species *</label>
                        <select id="modal-species" required>
                          <option value="Vannamei Shrimp" selected>Vannamei Shrimp</option>
                          <option value="Black Tiger Shrimp">Black Tiger Shrimp</option>
                          <option value="Asian Seabass (Barramundi)">Asian Seabass (Barramundi)</option>
                        </select>
                      </div>

                      <div class="create-booking-field">
                        <label>Purchase Type *</label>
                        <select id="modal-purchase-type" required>
                          <option value="Direct Farmer Procurement" selected>Direct Farmer Procurement</option>
                          <option value="Hatchery Buyback Contract">Hatchery Buyback Contract</option>
                          <option value="Agent Procurement Order">Agent Procurement Order</option>
                          <option value="Corporate Feed-Linked Booking">Corporate Feed-Linked Booking</option>
                          <option value="Spot Market Purchase">Spot Market Purchase</option>
                        </select>
                      </div>

                      <div class="create-booking-field">
                        <label>Booking Number</label>
                        <input id="modal-booking-number" value="${nextNum}" readonly style="background:#F1F5F9; font-weight:bold;" />
                      </div>

                      <div class="create-booking-field">
                        <label>Vehicle Number</label>
                        <input id="modal-vehicle" placeholder="e.g. AP 37 TE 4821" value="AP 37 TE 8890" />
                      </div>

                      <div class="create-booking-field">
                        <label>Driver Name</label>
                        <input id="modal-driver" placeholder="e.g. G. Narayana" value="K. Subbarao" />
                      </div>

                      <div class="create-booking-field">
                        <label>Grader Name</label>
                        <input id="modal-grader" placeholder="e.g. B. Venkatesh" value="B. Venkatesh" />
                      </div>

                      <div class="create-booking-field">
                        <label>Booking Date *</label>
                        <input type="date" id="modal-date" value="${todayStr}" required />
                      </div>

                      <div class="create-booking-field">
                        <label>Farm Location</label>
                        <input id="modal-farm" placeholder="e.g. Bhimavaram Cluster #4" value="Kakinada Coast Pond #1" />
                      </div>

                      <div class="create-booking-field create-booking-field--span-three">
                        <label>Suppliers *</label>
                        <select id="modal-supplier" required>
                          <option value="Direct Farmer" selected>Direct Farmer</option>
                          <option value="Coastal Marine Agency">Coastal Marine Agency</option>
                          <option value="Sagar Marine Brokers">Sagar Marine Brokers</option>
                          <option value="Delta Seafood Associates">Delta Seafood Associates</option>
                          <option value="Nellore Aqua Syndicate">Nellore Aqua Syndicate</option>
                        </select>
                      </div>
                    </div>

                    <div class="create-booking-grid create-booking-grid--two mt-3">
                      <div class="create-booking-field">
                        <label>Agent Name</label>
                        <input id="modal-agent" placeholder="e.g. Coastal Marine Agency" value="Coastal Marine Agency" />
                      </div>
                      <div class="create-booking-field">
                        <label>Remarks</label>
                        <textarea id="modal-remarks" rows="2" placeholder="e.g. Harvest scheduled for 4:00 AM...">Early harvest crates prepared with ice slurry</textarea>
                      </div>
                    </div>
                  </section>

                  <section class="create-booking-section create-booking-section--general">
                    <h3>Booking Details</h3>
                    <div class="create-booking-grid create-booking-grid--three">
                      <div class="create-booking-field">
                        <label>Booking Count *</label>
                        <input id="modal-count" placeholder="e.g. 40 Count" value="40 Count" required />
                      </div>

                      <div class="create-booking-field">
                        <label>Booking Weight (KGS) *</label>
                        <input type="number" id="modal-weight" min="1" step="any" placeholder="e.g. 3500" value="3500" required />
                      </div>

                      <div class="create-booking-field">
                        <label>Booking Rate (₹ / KG) *</label>
                        <input type="number" id="modal-rate" min="1" step="any" placeholder="e.g. 440" value="440" required />
                      </div>
                    </div>
                  </section>

                  <div class="create-booking-modal__footer pt-2">
                    <button type="button" class="create-booking-modal__cancel" id="modal-cancel-btn">Cancel</button>
                    <button type="submit" class="create-booking-modal__save">Save Booking</button>
                  </div>
                </form>
              </div>
            </div>
          `;

          const closeBtn = document.getElementById('c26-modal-close-btn');
          const cancelBtn = document.getElementById('modal-cancel-btn');
          const form = document.getElementById('form-create-booking');

          const closeModal = () => { modalMount.innerHTML = ''; };
          if (closeBtn) closeBtn.onclick = closeModal;
          if (cancelBtn) cancelBtn.onclick = closeModal;

          if (form) {
            form.onsubmit = (e) => {
              e.preventDefault();
              const newBooking = {
                id: nextId,
                serialNumber: AppState.bookings.length + 1,
                species: document.getElementById('modal-species')?.value || 'Vannamei Shrimp',
                bookingNumber: document.getElementById('modal-booking-number')?.value || nextNum,
                bookingDate: document.getElementById('modal-date')?.value || todayStr,
                purchaseType: document.getElementById('modal-purchase-type')?.value || 'Direct Farmer Procurement',
                grader: document.getElementById('modal-grader')?.value || '—',
                agent: document.getElementById('modal-agent')?.value || 'Direct Farmer',
                bookingCount: document.getElementById('modal-count')?.value || '40 Count',
                bookingWeight: Number(document.getElementById('modal-weight')?.value) || 0,
                bookingValue: (Number(document.getElementById('modal-weight')?.value) || 0) * (Number(document.getElementById('modal-rate')?.value) || 0),
                bookingRate: Number(document.getElementById('modal-rate')?.value) || 0,
                arrivalPlant: document.getElementById('modal-station')?.value || 'Kakinada',
                bookingStation: document.getElementById('modal-station')?.value || 'Kakinada',
                vehicleNumber: document.getElementById('modal-vehicle')?.value || '',
                driverName: document.getElementById('modal-driver')?.value || '',
                farmLocation: document.getElementById('modal-farm')?.value || '',
                supplier: document.getElementById('modal-supplier')?.value || 'Direct Farmer',
                remarks: document.getElementById('modal-remarks')?.value || ''
              };

              AppState.bookings.unshift(newBooking);
              closeModal();
              renderSubTab();
              showToast(`Booking ${newBooking.bookingNumber} created!`, 'success');
            };
          }
        };
      }
    }

    // Bind Top Tabs & Sidebar Clicks
    function bindNavigation() {
      // Top Horizontal Tabs
      const topTabs = document.querySelectorAll('#c26-main-nav .purchase-operations-tab');
      topTabs.forEach(tab => {
        tab.onclick = () => {
          AppState.activeTab = tab.getAttribute('data-tab');
          renderSubTab();
        };
      });

      // Sidebar Vertical Links
      const sidebarLinks = document.querySelectorAll('#c26-sidebar .c26-sb-link[data-tab]');
      sidebarLinks.forEach(link => {
        link.onclick = () => {
          AppState.activeTab = link.getAttribute('data-tab');
          renderSubTab();
        };
      });

      // Sidebar Collapse Toggle
      const toggleBtn = document.getElementById('c26-sidebar-toggle');
      const sidebar = document.getElementById('c26-sidebar');
      const toggleIcon = document.getElementById('c26-toggle-icon');

      if (toggleBtn && sidebar) {
        toggleBtn.onclick = () => {
          sidebar.classList.toggle('collapsed');
          if (toggleIcon) {
            toggleIcon.classList.toggle('rotate-180');
          }
        };
      }
    }

    // App Init
    window.addEventListener('DOMContentLoaded', () => {
      bindNavigation();
      renderSubTab();
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    });
